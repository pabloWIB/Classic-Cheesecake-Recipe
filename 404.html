  <link rel="stylesheet" href="assets/css/components.css">

  <script>
    // Applies the stored theme before first paint so the page never flashes.
    (function () {
      try {
        var stored = localStorage.getItem("cheesecake:theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-theme",
          stored || (prefersDark ? "dark" : "light")
        );
      } catch (error) {
        /* Storage blocked — the light theme in the markup stands. */
      }
    })();
  </script>
</head>

<body>
  <main class="error-page container">
    <p class="error-page__code">404</p>
    <h1 class="error-page__title">This page is not on the menu</h1>
    <p class="error-page__text">There is only one recipe on this site, and it is a good one. Go back and bake it.</p>
    <p class="error-page__action">
      <a class="button" href="index.html">Back to the recipe</a>
    </p>
  </main>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
